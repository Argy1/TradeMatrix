# Railway config for the "api" service (root directory: backend).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Singapore: close to the Supabase database (ap-southeast-1) and to users in Indonesia.
[deploy.multiRegionConfig.asia-southeast1-eqsg3a]
numReplicas = 1
