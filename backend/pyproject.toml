[project]
name = "tradematrix-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.3,<4",
    "asyncpg>=0.31.0",
    "defusedxml>=0.7.1",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "joblib>=1.6.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "scikit-learn>=1.9.1",
    "sentry-sdk[fastapi]>=2.71.0",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.1.2",
    "uvicorn[standard]>=0.54.0",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

# The code is run from this folder (uvicorn app.api.main:app), not installed as a wheel.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: errors, I: import order, UP: modern syntax, B: likely bugs, SIM: simplifications,
# ASYNC: blocking calls inside async code, RUF: ruff's own checks.
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Notebook cells are teaching material: long explanatory lines are fine there.
"notebooks/*" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: calls the real exchange (run with `-m live`)",
    "db: runs SQL against the real database inside a rolled-back transaction (run with `-m db`)",
]
addopts = "-m 'not live and not db'"
